# Instala e testa a app como um colega faria, em Macs e Windows reais na nuvem.
# Corre a cada push e à mão (separador Actions > "Testar a app" > Run workflow).
name: Testar a app

on:
  push:
  workflow_dispatch:
    inputs:
      com_ia:
        description: "Instalar também a IA e analisar sons (demora ~20 min)"
        type: boolean
        default: true

concurrency:
  group: testar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]   # Sonoma M1, Sequoia M1, Sequoia Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir a app (zip igual ao que se envia)
        run: |
          pip install numpy
          mkdir -p dist montagem
          # executável nativo universal (chip M + Intel)
          clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2             -o montagem/sfxtagger ferramentas/mac/lancador.c
          python ferramentas/build_mac_app.py montagem --lancador montagem/sfxtagger
          # assinatura ad hoc: sem ela o macOS 15 não mostra "Abrir na mesma"
          ditto -x -k montagem/*.zip montagem/app
          codesign --force --deep --sign - "montagem/app/SFX Tagger.app"
          codesign --verify --deep --strict --verbose=2 "montagem/app/SFX Tagger.app"
          lipo -info "montagem/app/SFX Tagger.app/Contents/MacOS/sfxtagger"
          NOME="$(basename montagem/*.zip)"
          ditto -c -k --norsrc montagem/app "dist/$NOME"

      - name: Guardar o zip para enviar aos colegas
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: SFX-Tagger-Mac
          path: dist/*.zip

      - name: Instalar como um colega (zip descarregado, em quarentena)
        run: |
          # o Finder extrai com o ditto; o browser marca tudo como descarregado da internet
          ditto -x -k dist/*.zip extraido
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" "extraido/SFX Tagger.app"
          mv "extraido/SFX Tagger.app" /Applications/
          # a assinatura sobreviveu ao zip?
          codesign --verify --deep --strict "/Applications/SFX Tagger.app"
          # o que o Gatekeeper diz (rejeitado é o esperado: não é notarizada pela Apple)
          spctl --assess --type execute -vv "/Applications/SFX Tagger.app" || true
          # o equivalente a "Abrir na mesma" (no CI não há quem clique)
          xattr -cr "/Applications/SFX Tagger.app"
          ls -la "/Applications/SFX Tagger.app/Contents/MacOS"

      - name: Abrir a app (duplo clique) e clicar outra vez, impaciente
        run: |
          open "/Applications/SFX Tagger.app"
          sleep 8
          open "/Applications/SFX Tagger.app"

      - name: Testar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.com_ia }}" = "false" ]; then
            python ferramentas/ci/teste_fim_a_fim.py --sem-ia
          else
            python ferramentas/ci/teste_fim_a_fim.py
          fi

      - name: Confirmar que corre nativo (sem emulação Intel nos Macs com chip M)
        run: |
          LOG="$HOME/Library/Application Support/SFXTagger/registo.log"
          if [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = "1" ]; then
            grep -q "arquitetura: arm64" "$LOG" && grep -q "· arm64 ·" "$LOG" || { echo "A app correu em emulação Intel"; exit 1; }
          fi
          grep "arquitetura\|Servidor pronto\|Python 3" "$LOG"

      - name: Captura de ecrã e registos
        if: always()
        run: |
          mkdir -p resultado
          screencapture -x resultado/ecra.png || true
          SUP="$HOME/Library/Application Support/SFXTagger"
          cp "$SUP"/*.log resultado/ 2>/dev/null || true
          ls -la "$SUP" || true
          for f in "$SUP"/registo*.log; do echo "===== $f"; tail -60 "$f"; done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registos-${{ matrix.os }}
          path: resultado/

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir o zip
        run: |
          pip install numpy
          mkdir -p dist
          python ferramentas/build_windows.py dist

      - name: Extrair e abrir como um colega
        shell: pwsh
        env:
          SFXTAGGER_NO_BROWSER: "1"
          SFXTAGGER_NO_SHORTCUT: "1"
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName extraido
          $bat = Get-ChildItem -Recurse extraido -Filter "Abrir SFX Tagger.bat" | Select-Object -First 1
          cmd /c "`"$($bat.FullName)`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testar
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.com_ia }}" -eq "false") {
            python ferramentas/ci/teste_fim_a_fim.py --sem-ia
          } else {
            python ferramentas/ci/teste_fim_a_fim.py
          }

      - name: Registos
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resultado | Out-Null
          Copy-Item "$env:LOCALAPPDATA\SFXTagger\*.log" resultado -ErrorAction SilentlyContinue
          Get-ChildItem resultado | ForEach-Object { "===== $_"; Get-Content $_ -Tail 60 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registos-windows
          path: resultado/
